name: Publish to PyPI

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target:
        description: Target package index
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
      bump:
        description: Version bump override (when running manually on main)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  tag-release:
    name: Compute SemVer & Create Release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semver.outputs.released }}
      tag: ${{ steps.semver.outputs.tag }}
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine SemVer bump & create GitHub Release
        id: semver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_OVERRIDE: ${{ inputs.bump || 'auto' }}
        run: |
          git fetch --tags --force
          EXISTING_TAG=$(git tag --points-at HEAD 'v*' | head -n 1)
          if [ -n "$EXISTING_TAG" ]; then
            echo "HEAD is already tagged ($EXISTING_TAG); skipping auto-tag."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            VERSION="${LAST_TAG#v}"
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s%n%b")
          else
            VERSION="0.0.0"
            COMMITS=$(git log HEAD --pretty=format:"%s%n%b")
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          HEAD_SUBJECT=$(git log -1 --pretty=format:"%s")
          if echo "$HEAD_SUBJECT" | grep -qiE '\[skip release\]|\[no release\]'; then
            echo "HEAD commit subject requested [skip release]; skipping release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BUMP_OVERRIDE" != "auto" ]; then
            BUMP="$BUMP_OVERRIDE"
          elif echo "$COMMITS" | grep -qE '^(\* )?[a-zA-Z]+(\([^)]+\))?!:|BREAKING CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^(\* )?feat(\([^)]+\))?:'; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Verify & Build Distributions
    needs: [tag-release]
    if: always() && (github.event_name == 'release' || inputs.target == 'testpypi' || needs.tag-release.outputs.released == 'true')
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      RELEASE_TAG: ${{ github.event.release.tag_name || needs.tag-release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
          fetch-depth: 0

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Bootstrap environment
        run: make bootstrap UV_SYNC_FLAGS="--frozen"

      - name: Run static checks
        run: make static-check

      - name: Run test suite
        run: make test

      - name: Build sdist and wheel
        run: make build-package

      - name: Smoke-test built wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          VERSION=$(uv run --isolated --no-project --with "$WHEEL" python -c "import lanspector; print(lanspector.__version__)")
          echo "Built wheel version: $VERSION"
          if [[ "$VERSION" == *".post"* ]] || [[ "$VERSION" == *"+"* ]]; then
            echo "::error::Wheel version ($VERSION) contains local/post dev segment; expected clean SemVer tag."
            exit 1
          fi
          uv run --isolated --no-project --with "$WHEEL" lanspector --help

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  attach-release-assets:
    name: Attach Distributions to GitHub Release
    needs: [tag-release, build]
    if: always() && needs.build.result == 'success' && (github.event_name == 'release' || needs.tag-release.outputs.released == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || needs.tag-release.outputs.tag }}
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create or update GitHub Release with sdist and wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "${{ github.repository }}" || \
              echo "::warning::Release $RELEASE_TAG is immutable; assets were not re-uploaded."
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              --repo "${{ github.repository }}"
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: [tag-release, build]
    if: always() && needs.build.result == 'success' && (github.event_name == 'release' || inputs.target == 'pypi' || needs.tag-release.outputs.released == 'true')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lanspector
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lanspector
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
